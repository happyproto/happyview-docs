name: Preview

# Each pull request from a branch of this repository is deployed as its own
# wisp.place preview site, pr-<sha7>, at
# https://pr-<sha7>-<claim>.preview.wisp.place/, and the URL is posted on
# the pull request. Preview sites are served with X-Robots-Tag: noindex.
#
# Previews deploy as their own account, WISP_PREVIEW_HANDLE on pds.kart.sh,
# not as the happyview.dev account that deploy.yml uses for the production
# site. Each preview is a new site, so wispctl uploads every file again, and
# those uploads used to share the production account's PDS blob rate limit:
# a burst of previews made production deploys fail with 429 (HAP-394).
# wisp serves pr-<sha7>-<claim> from the account that owns <claim>, so
# WISP_PREVIEW_CLAIM must be a wisp subdomain claimed by that same account.
# Off until WISP_PREVIEW_CLAIM is set.
#
# Draft pull requests get no preview. Marking a pull request ready deploys
# its preview, and each later push to it deploys a new one.

permissions:
  contents: read
  pull-requests: write

on:
  # Every pull request, including one stacked on another branch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: vars.WISP_PREVIEW_CLAIM != '' && vars.WISP_PREVIEW_HANDLE != '' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install wispctl
        run: npm i -g wispctl@2.1.0

      - name: Deploy preview
        run: wispctl deploy "$WISP_PREVIEW_HANDLE" --path dist --sha "$SHA" --preview-claim "$WISP_PREVIEW_CLAIM" --yes --quiet
        env:
          WISP_PREVIEW_HANDLE: ${{ vars.WISP_PREVIEW_HANDLE }}
          WISP_PREVIEW_CLAIM: ${{ vars.WISP_PREVIEW_CLAIM }}
          WISPCTL_APP_PASSWORD: ${{ secrets.WISP_PREVIEW_APP_PASSWORD }}
          SHA: ${{ github.event.pull_request.head.sha }}

      - name: Post the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WISP_PREVIEW_CLAIM: ${{ vars.WISP_PREVIEW_CLAIM }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          url="https://pr-${SHA:0:7}-${WISP_PREVIEW_CLAIM}.preview.wisp.place/"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Preview of ${SHA:0:7}: $url (comment sign-in works only on happyview.dev)"
