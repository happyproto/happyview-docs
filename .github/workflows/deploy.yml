name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 50
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # sequoia publishes new blog posts as site.standard documents; without
      # these it skips (scripts/sequoia-publish.mjs).
      ATP_IDENTIFIER: ${{ vars.ATP_IDENTIFIER }}
      ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Tests
        run: bun test

      - name: Install wispctl
        run: npm i -g wispctl@2.1.0

      # wispctl reads the app password from WISPCTL_APP_PASSWORD, so the
      # secret never appears on the command line.
      #
      # The account's PDS rate-limits uploadBlob. wispctl retries each blob
      # for only about six seconds before it gives up, so a deploy that
      # follows another one closely fails with a 429 (most failed deploys
      # since Nov 7 did). Retry the whole deploy after a longer wait. The 429
      # comes while blobs upload, before wispctl writes any records, so a
      # failed attempt leaves the live site as it was.
      - name: Deploy to wisp.place
        id: deploy
        run: |
          waits=(300 600 900)
          for attempt in 1 2 3 4; do
            if wispctl deploy "$WISP_HANDLE" --path dist --site "$WISP_SITE" --yes --quiet --concurrency 2; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              break
            fi
            delay=${waits[$((attempt - 1))]}
            echo "::warning::wispctl deploy failed on attempt $attempt; retrying in $((delay / 60)) minutes"
            sleep "$delay"
          done
          echo "::error::wispctl deploy failed after 4 attempts"
          exit 1
        env:
          WISP_HANDLE: ${{ vars.WISP_HANDLE }}
          WISP_SITE: ${{ vars.WISP_SITE }}
          WISPCTL_APP_PASSWORD: ${{ secrets.WISP_APP_PASSWORD }}

      # Checks the docs index, a deep docs page with and without its trailing
      # slash, llms.txt, the sitemap and a legacy redirect
      # (scripts/smoke-check.sh). The wisp.place copy shows the deploy itself
      # worked.
      - name: Smoke check (wisp.place)
        run: scripts/smoke-check.sh "https://sites.wisp.place/$WISP_HANDLE/$WISP_SITE"
        env:
          WISP_HANDLE: ${{ vars.WISP_HANDLE }}
          WISP_SITE: ${{ vars.WISP_SITE }}

      # The public domain shows readers get it. This fails while happyview.dev
      # points anywhere other than wisp.place, which is the point: the old
      # check was skipped until SITE_URL was set, and it never was, so a
      # domain still serving the old Vercel site went unnoticed.
      - name: Smoke check (public domain)
        if: always() && steps.deploy.outcome == 'success'
        run: scripts/smoke-check.sh "$SITE_URL"
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://happyview.dev' }}
